<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Penatu Wastra</title>
    <link rel="stylesheet" href="login.css">
    <!-- Menggunakan Font Awesome untuk ikon Email dan Kata Sandi -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="login-body">

    <!-- CONTAINER KARTU LOGIN UTAMA -->
    <div class="login-card">
        <img src="assets/logo.png" alt="Logo Penatu Wastra" class="card-logo">

        <div class="login-header">
            <h2>Selamat datang</h2>
            <div class="divider"></div>
        </div>

        <!-- FORM LOGIN -->
        <form class="login-form" onsubmit="event.preventDefault(); window.location.href='home.html';">
            <!-- INPUT EMAIL -->
            <div class="input-group">
                <label for="email">Email</label>
                <div class="input-wrapper">
                    <i class="fa-regular fa-envelope input-icon"></i>
                    <input type="email" id="email" name="email" placeholder="Lala1212@gmail.com" required>
                </div>
            </div>

            <!-- INPUT KATA SANDI -->
            <div class="input-group">
                <label for="password">Kata Sandi</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-lock input-icon"></i>
                    <input type="password" id="password" name="password" placeholder="****************" required>
                </div>
                <div class="forgot-password">
                    <a href="#">Lupa?</a>
                </div>
            </div>

            <!-- TOMBOL LOGIN -->
            <button type="submit" class="btn-login">Login</button>

            <!-- FOOTER REGISTRASI -->
            <p class="signup-text">
                Belum mempunyai akun? <a href="register.html">Daftar</a>
            </p>

        </form>

    </div>

</body>
</html>
