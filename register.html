<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daftar Akun - Penatu Wastra</title>
    <link rel="stylesheet" href="register.css">
    <!-- Font Awesome untuk ikon Email, User, dan Kata Sandi -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="register-body">

    <!-- KARTU UTAMA REGISTRASI -->
    <div class="register-card">
        <img src="assets/logo.png" alt="Logo Penatu Wastra" class="card-logo">

        <div class="register-header">
            <h2>Buat Akun Milikmu</h2>
            <div class="divider"></div>
        </div>

        <!-- FORM REGISTRASI -->
        <form class="register-form" action="#" method="POST">
            
            <!-- INPUT EMAIL -->
            <div class="input-group">
                <label for="email">Email</label>
                <div class="input-wrapper">
                    <i class="fa-regular fa-envelope input-icon"></i>
                    <input type="email" id="email" name="email" placeholder="Lala1212@gmail.com" required>
                </div>
            </div>

            <!-- INPUT NAMA LENGKAP -->
            <div class="input-group">
                <label for="fullname">Nama Lengkap</label>
                <div class="input-wrapper">
                    <i class="fa-regular fa-user input-icon"></i>
                    <input type="text" id="fullname" name="fullname" placeholder="Masukkan nama kamu" required>
                </div>
            </div>

            <!-- INPUT KATA SANDI -->
            <div class="input-group">
                <label for="password">Kata Sandi</label>
                <div class="input-wrapper">
                    <i class="fa-solid fa-lock input-icon"></i>
                    <input type="password" id="password" name="password" placeholder="****************" required>
                </div>
            </div>

            <!-- TOMBOL DAFTAR -->
            <button type="submit" class="btn-register">Daftar</button>

            <!-- FOOTER SUDAH PUNYA AKUN -->
            <p class="login-redirect-text">
                Sudah mempunyai akun? <a href="login.html">Login</a>
            </p>

        </form>

    </div>

</body>
</html>
